name: flutter-compat

# Generates a Flutter app that depends on this checkout, once per supported
# Flutter release line, and proves the native build works there. Pub has to
# pick the expected hooks, code_assets and native_toolchain_c. The Linux build
# has to compile and decode JSON on the device. The release APK has to carry
# a 16 KB aligned library for every ABI, with the C++ standard library linked
# in statically. The same app and decode test then run on an Android emulator
# and an iOS simulator, on the oldest and newest Flutter release here.
#
# The mobile jobs reuse the setup steps of the compat job through YAML
# anchors. APP_PLATFORMS picks the platforms `flutter create` generates.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, after ci.yaml. New releases of the build packages or a new runner
  # image show up here without a push.
  schedule:
    - cron: '43 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compat:
    name: >-
      Flutter ${{ matrix.flutter.version }}${{ matrix.flutter.upgrade && ' upgraded' || '' }}
      ${{ matrix.target }}
    # Pinned. A newer image may lack libstdc++-12-dev.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_PLATFORMS: linux,android
    strategy:
      fail-fast: false
      matrix:
        # Newest stable patch of each line in
        # https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json
        #
        # The `expect` value is what pub has to resolve. The `flutter create`
        # command seeds the lock file with the meta version the SDK itself
        # locks. That is 1.17.0 on 3.38 and 3.41, 1.18.0 on 3.44, 1.18.3 on
        # 3.47 and 1.19.0 on 3.50.
        # native_toolchain_c 0.19.6 needs meta ^1.19.0. A new app therefore
        # gets the older releases up to 3.47. On 3.47 the SDK allows meta
        # ^1.18.3, and `flutter pub upgrade` moves an app to the newer
        # releases. The `upgrade` row covers that path.
        #
        # A `name=version` entry is an exact match and `name>=version` accepts
        # that release or a newer one. The seeded rows are exact because they
        # prove what an older SDK resolves. The upgraded row and the 3.50 row
        # take the newest releases and only set a floor, which keeps them
        # green after the next upstream release.
        flutter:
          - version: 3.38.10
            expect: code_assets=1.2.1 hooks=2.0.2 native_toolchain_c=0.19.2
          - version: 3.41.9
            expect: code_assets=1.2.1 hooks=2.0.2 native_toolchain_c=0.19.2
          - version: 3.44.9
            expect: code_assets=1.2.1 hooks=2.0.2 native_toolchain_c=0.19.2
          - version: 3.47.9
            expect: code_assets=1.2.1 hooks=2.0.2 native_toolchain_c=0.19.2
          - version: 3.47.9
            upgrade: true
            expect: code_assets>=2.2.0 hooks>=2.2.0 native_toolchain_c>=0.19.6
          - version: 3.50.0
            expect: code_assets>=2.2.0 hooks>=2.2.0 native_toolchain_c>=0.19.6
        target: [linux, android]
    steps:
      - uses: actions/checkout@v4

      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - &setup-flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter.version }}
          channel: stable
          # Not cached. One release takes about 1.7 GB of the 10 GB repository
          # cache and the matrix needs five of them.
          cache: false

      - name: Install the Linux desktop toolchain
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb

      - &create-app
        name: Create the consumer app
        working-directory: ${{ runner.temp }}
        run: flutter create --platforms="$APP_PLATFORMS" --project-name compat_app compat_app

      # Copies the decode test in, then depends on this checkout by path.
      - &add-simdjson-dart
        name: Add simdjson_dart
        run: |
          dart tool/ci/prepare_app.dart "$RUNNER_TEMP/compat_app"
          cd "$RUNNER_TEMP/compat_app"
          flutter pub add "simdjson_dart:{\"path\":\"$GITHUB_WORKSPACE\"}" \
            'dev:integration_test:{"sdk":"flutter"}'
          flutter pub get

      - name: Upgrade within the SDK constraints
        if: matrix.flutter.upgrade
        working-directory: ${{ runner.temp }}/compat_app
        run: flutter pub upgrade

      - name: Check resolved versions
        working-directory: ${{ runner.temp }}/compat_app
        env:
          EXPECT: ${{ matrix.flutter.expect }}
        run: |
          flutter pub deps --json > deps.json
          # EXPECT is a space separated list of name=version and
          # name>=version arguments.
          # shellcheck disable=SC2086
          dart "$GITHUB_WORKSPACE/tool/ci/check_resolution.dart" deps.json $EXPECT

      - name: Build for Linux
        if: matrix.target == 'linux'
        working-directory: ${{ runner.temp }}/compat_app
        run: flutter build linux --debug

      - name: Decode on Linux
        if: matrix.target == 'linux'
        working-directory: ${{ runner.temp }}/compat_app
        run: xvfb-run -a flutter test integration_test -d linux

      # Gradle and its dependencies only. An NDK the runner lacks is still
      # downloaded on each run. The key hashes the Gradle, Android plugin and
      # Kotlin versions that the Flutter template writes. Release lines with
      # one template share an entry of about 1.2 GB. GitHub evicts an entry
      # after a week without a restore.
      - name: Key the Gradle cache
        id: gradle-key
        if: matrix.target == 'android'
        working-directory: ${{ runner.temp }}/compat_app/android
        run: |
          hash=$(cat gradle/wrapper/gradle-wrapper.properties settings.gradle.kts | sha256sum | cut -c1-16)
          echo "key=gradle-$RUNNER_OS-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the Gradle cache
        id: gradle-cache
        if: matrix.target == 'android'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-key.outputs.key }}

      # The template signs release builds with the debug key.
      - name: Build the release APK
        if: matrix.target == 'android'
        working-directory: ${{ runner.temp }}/compat_app
        run: flutter build apk --release

      # Saved only from main and only when the restore missed. Two rows with
      # one template can both miss. The second save then logs a warning and
      # the job still passes.
      - name: Save the Gradle cache
        if: >-
          matrix.target == 'android' &&
          steps.gradle-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-key.outputs.key }}

      - name: Check the packed native libraries
        if: matrix.target == 'android'
        working-directory: ${{ runner.temp }}/compat_app
        run: dart "$GITHUB_WORKSPACE/tool/ci/check_apk.dart" build/app/outputs/flutter-apk/app-release.apk

  android-emulator:
    name: Flutter ${{ matrix.flutter.version }} Android API ${{ matrix.api-level }} emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_PLATFORMS: android
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - version: 3.38.10
          - version: 3.50.0
        # Flutter 3.38.10 and 3.50.0 both write minSdkVersion 24 and
        # targetSdkVersion 36 into a new app. The emulator runs the oldest
        # Android the app installs on and the one it targets.
        api-level: [24, 36]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - *setup-flutter
      - *create-app
      - *add-simdjson-dart

      - name: Show the Flutter version
        run: flutter --version

      # Gradle, the NDK and the build hook run here and not while the emulator
      # waits. A build failure then shows up as its own step.
      - name: Build the x86_64 debug APK
        working-directory: ${{ runner.temp }}/compat_app
        run: flutter build apk --debug --target-platform android-x64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The action runs each script line in a separate shell. It sets
      # EMULATOR_PORT, and the emulator's adb serial is emulator-<port>.
      # Flutter 3.50.0 has no suite load timeout of its own (see the
      # simulator job). The dart_test.yaml line sets 12 minutes. A launch
      # that never connects then fails there and not at the job limit.
      - name: Decode on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          working-directory: ${{ runner.temp }}/compat_app
          script: |
            echo 'suite_load_timeout: 12m' > dart_test.yaml
            adb devices -l
            echo "device emulator-$EMULATOR_PORT, API $(adb -s emulator-$EMULATOR_PORT shell getprop ro.build.version.sdk), ABI $(adb -s emulator-$EMULATOR_PORT shell getprop ro.product.cpu.abi)"
            flutter test integration_test -d emulator-$EMULATOR_PORT

  ios-simulator:
    name: Flutter ${{ matrix.flutter.version }} iOS simulator
    # Pinned to Xcode 16.4, the macos-15 default. Flutter 3.38.10 needs Xcode 14
    # or newer and 3.50.0 needs Xcode 15 or newer, and both run on it.
    runs-on: macos-15
    # Room for three simulator attempts of about 13 minutes each.
    timeout-minutes: 55
    env:
      APP_PLATFORMS: ios
      XCODE: /Applications/Xcode_16.4.app
      # Both ship with Xcode 16.4 on macos-15.
      SIMULATOR_DEVICE: com.apple.CoreSimulator.SimDeviceType.iPhone-16
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-5
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - version: 3.38.10
          - version: 3.50.0
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE"

      - *setup-flutter
      - *create-app
      - *add-simdjson-dart

      - name: Show the Flutter and Xcode versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl create simdjson_dart_ci "$SIMULATOR_DEVICE" "$SIMULATOR_RUNTIME")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      # Flutter 3.38.10 and 3.50.0 can launch the app before their simulator
      # `log stream` is ready and then miss the VM service URL
      # (flutter/flutter#181771, fixed on master by flutter/flutter#193142).
      # The test then times out after 12 minutes without running and Flutter
      # prints the debug connection error below. Only that case is retried,
      # up to twice. A failing test is never retried. Flutter 3.50.0 ships
      # test_core 0.6.20, which has no suite load timeout by default
      # (dart-lang/test#2505). Without one the test waits until the job is
      # cancelled. The dart_test.yaml line below sets 12 minutes again.
      - name: Decode on the simulator
        working-directory: ${{ runner.temp }}/compat_app
        shell: bash
        run: |
          echo "device $SIMULATOR_UDID"
          echo 'suite_load_timeout: 12m' > dart_test.yaml
          signature='Error waiting for a debug connection: The log reader failed unexpectedly'
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/decode-$attempt.log"
            if flutter test integration_test -d "$SIMULATOR_UDID" 2>&1 | tee "$log"; then
              exit 0
            fi
            if [ "$attempt" = 3 ] || ! grep -qF "$signature" "$log" ||
              ! grep -qF '0 tests passed, 1 failed.' "$log"; then
              exit 1
            fi
            echo "::warning::The app never reported its VM service URL. Retrying."
          done
