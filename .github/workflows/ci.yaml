name: ci

on:
  push:
    branches: [main]
  pull_request:

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '28 7 * * 1'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test bench example hook
      - run: dart analyze --fatal-infos
      - run: dart test

      # The READMEs quote these programs' output, so run them: analysis alone
      # would let an example keep compiling while printing something the docs
      # no longer match.
      - run: dart run example/simdjson_dart_example.dart
      - run: dart run example/ndjson_log_scan.dart
      - run: dart run example/ndjson_stream.dart
