name: simdjson_dart
description: >-
  Read a few fields out of a large JSON payload without decoding the rest,
  backed by the simdjson C++ library over FFI. Whole-document and NDJSON
  decoding too.
version: 1.6.2
repository: https://github.com/Yusufihsangorgel/simdjson_dart
issue_tracker: https://github.com/Yusufihsangorgel/simdjson_dart/issues

topics:
  - json
  - performance
  - ffi
  - parser
  - simd

screenshots:
  - description: >-
      A 9.3 MB JSON response, three fields read out of it: jsonDecode plus
      indexing against SimdJsonDocument.at, with the ratio printed.
    path: doc/demo.gif
  - description: >-
      Throughput against dart:convert: reading three values out of 6.7 MB of
      string-heavy JSON is 14.8x faster, decoding every field 1.19x to 1.75x.
    path: doc/bench.png

# Android and iOS run the on-device test on an emulator and a simulator in
# flutter-compat.yaml. Linux, macOS and Windows run the Dart VM tests. The
# package uses dart:ffi and does not run on the web.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: '>=1.2.1 <3.0.0'
  hooks: '>=2.0.2 <3.0.0'
  native_toolchain_c: '>=0.19.2 <0.20.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
